<!doctype html>
<html lang="zh-CN" data-theme="sf">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="物流配送管理系统 · 路径管理台" />
    <title>通驿 · 路径管理台</title>
    <script>
      (function () {
        var path = location.pathname || ''
        var title = '通驿 · 路径管理台'
        if (path.indexOf('/user') === 0) title = '通驿 · 寄件查询'
        else if (path.indexOf('/station') === 0) title = '通驿 · 驿站工作台'
        else if (path.indexOf('/courier') === 0) title = '通驿 · 快递员工作台'
        document.title = title
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
